<html lang="id">
<head>

  <style>
    :root{--blue:#075ca8;--blue2:#0a73c9;--navy:#0b3b65;--orange:#f59e0b;--bg:#f3f7fb;--surface:#fff;--text:#172437;--muted:#68778a;--line:#dfe7ef;--green:#16835b;--red:#c13b43;--shadow:0 4px 18px rgba(22,52,79,.07);--radius:11px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:264px 1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:264px;background:linear-gradient(180deg,#0c426e,#07365c 65%,#062f51);color:#fff;padding:24px 18px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;align-items:center;gap:12px;padding:0 7px 28px}.brand-mark{width:40px;height:40px;display:grid;grid-template-columns:1fr 1fr;gap:4px}.brand-mark i{border-radius:5px;background:#21a8df}.brand-mark i:nth-child(2){background:#79ba43}.brand-mark i:nth-child(3){background:#f39a21}.brand-mark i:nth-child(4){background:#fff}.brand strong{display:block;font-size:16px}.brand small{display:block;color:#bed0df;margin-top:3px;font-size:12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cfe0ed;text-align:left;padding:12px 13px;border-radius:7px;display:flex;gap:11px;align-items:center;font-size:13px;font-weight:650}.nav button:hover,.nav button.active{background:#0b66ad;color:#fff}.nav .ico{width:24px;height:22px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.38);border-radius:5px;font-size:9px;font-weight:850}.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding:15px 8px 0;color:#c5d6e3;font-size:11px;line-height:1.55}.side-credit{margin-top:10px;color:#a9c2d5}.main{grid-column:2;min-width:0;display:flex;flex-direction:column}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:10}.topbar h1{font-size:20px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:4px 0 0}.top-actions,.actions,.subactions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.user-pill{font-size:11px;padding:8px 10px;background:#eef5fb;border:1px solid #d4e4f1;border-radius:8px;color:#31536f}.year-select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 11px}.content{padding:28px 32px 48px;max-width:1550px;width:100%;margin:auto;flex:1}.app-footer{padding:18px 32px;border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px}.app-footer a{color:var(--blue);text-decoration:none}.view{display:none}.view.active{display:block}.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.view-head h2{font-size:24px;margin:0 0 5px}.view-head p{margin:0;color:var(--muted);font-size:14px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:7px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn:hover{border-color:#aebdcc;background:#f9fbfd}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled,.btn.disabled{opacity:.55;cursor:not-allowed;pointer-events:none}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.kpi,.panel,.form-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.kpi{padding:19px 20px;position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--blue)}.kpi:nth-child(2):before{background:#18a272}.kpi:nth-child(3):before{background:var(--orange)}.kpi:nth-child(4):before{background:#d45b64}.kpi .label{font-size:11px;color:var(--muted);font-weight:800}.kpi .value{font-size:26px;font-weight:800;margin-top:10px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:5px}.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:16px;margin-bottom:16px}.grid-even{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel h3{font-size:15px;margin:0}.muted{color:var(--muted)}.status-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.status-box{padding:12px;border-radius:10px;background:#f5f8fb;text-align:center}.status-box strong{display:block;font-size:21px}.status-box span{font-size:11px;color:var(--muted)}.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:18px}.month-bar{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}.month-bar i{width:100%;max-width:22px;background:linear-gradient(180deg,var(--blue2),var(--blue));border-radius:5px 5px 2px 2px;min-height:3px}.month-bar span{position:absolute;bottom:-21px;font-size:10px;color:var(--muted)}.share-list{display:grid;gap:12px}.share-row{display:grid;grid-template-columns:minmax(100px,1fr) 100px 40px;gap:10px;align-items:center;font-size:12px}.share-track{height:7px;background:#ecf1f5;border-radius:9px;overflow:hidden}.share-track i{display:block;height:100%;background:var(--blue)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.table,.editor-table{width:100%;border-collapse:collapse}.table{min-width:780px}.table th,.editor-table th{background:#f3f7fa;color:#506176;font-size:10px;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{font-size:12px;padding:12px;border-bottom:1px solid #edf1f5;vertical-align:top}.editor-table{min-width:1050px}.editor-table td{padding:5px;border-bottom:1px solid #e9eef3;vertical-align:top}.editor-table input,.editor-table select{width:100%;border:1px solid #d5dfe8;border-radius:6px;padding:7px;font-size:11px}.editor-table .w-xs{width:58px}.editor-table .w-sm{width:96px}.editor-table .w-md{width:160px}.money{font-variant-numeric:tabular-nums;white-space:nowrap}.chip{display:inline-flex;padding:5px 8px;border-radius:99px;background:#eef3f8;color:#456078;font-size:11px;font-weight:800}.chip.selesai{background:#e7f6ef;color:#177153}.chip.kontrak{background:#e8f1fb;color:#075ca8}.chip.fp{background:#fff4dc;color:#9b6500}.chip.draft{background:#edf0f3;color:#67717d}.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}.searchbox{min-width:280px}.searchbox input,.pok-search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px}.form-shell{display:grid;grid-template-columns:176px minmax(0,1fr);gap:18px}.form-nav{position:sticky;top:94px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px}.form-nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;font-size:12px;color:var(--muted);font-weight:700}.form-nav button:hover{background:#f2f6fa;color:var(--text)}.form-card{padding:20px;margin-bottom:14px;scroll-margin-top:94px}.form-card h3{margin:0 0 4px;font-size:16px}.form-card .desc{margin:0 0 18px;font-size:12px;color:var(--muted)}.fields{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.field{grid-column:span 6}.field.third{grid-column:span 4}.field.quarter{grid-column:span 3}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;color:#536579;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd8e3;border-radius:8px;padding:10px 11px;background:#fff;color:var(--text);font-size:13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(10,115,201,.1)}.field textarea{min-height:78px;resize:vertical}.field input[readonly]{background:#f3f6f8;color:#647488}.inline-note,.date-id{font-size:11px;color:var(--muted);margin-top:5px}.date-id{color:var(--blue);font-weight:700}.step-rail{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));position:relative;margin:2px 0 22px;padding:0 10px}.step-rail:before{content:"";position:absolute;left:8%;right:8%;top:17px;height:2px;background:#cfd8e2}.step{position:relative;z-index:1;text-align:center;color:#6d7a89;font-size:11px;font-weight:700}.step b{width:36px;height:36px;margin:0 auto 7px;display:grid;place-items:center;border:2px solid #b8c4d0;border-radius:50%;background:#fff}.step.active b,.step.done b{border-color:var(--blue2);background:var(--blue2);color:#fff}.editor-quick-summary{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,minmax(120px,auto));background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}.editor-quick-summary>div{padding:15px 17px;border-right:1px solid var(--line)}.editor-quick-summary .summary-title{background:#f5f8fb}.editor-quick-summary small{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:6px}.editor-quick-summary strong{font-size:15px}.summary-line{display:flex;gap:24px;flex-wrap:wrap;font-size:12px}.summary-line strong{font-size:15px;display:block;margin-top:3px}.subactions{justify-content:space-between;margin-top:12px}.paste-box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:0 0 12px}.paste-box textarea{min-height:70px;border:1px dashed #a9bfd2;border-radius:8px;padding:10px;font-size:12px}.tax-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tax-option{display:grid;grid-template-columns:auto 1fr 84px;gap:9px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px}.tax-option input[type=number]{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px}.calc-box{background:#f6f9fc;border:1px solid #dbe6ef;border-radius:9px;padding:15px}.calc-row{display:flex;justify-content:space-between;gap:20px;padding:5px 0;font-size:12px}.calc-row.total{border-top:1px solid #ccd9e4;margin-top:7px;padding-top:11px;font-size:15px;font-weight:800}.warning{background:#fff7e6;border:1px solid #f4d494;color:#7e5a14;padding:12px 14px;border-radius:9px;font-size:12px}.success{background:#eaf7f1;border:1px solid #b9e5d1;color:#176447;padding:12px 14px;border-radius:9px;font-size:12px}.pok-search{display:flex;gap:9px;margin-bottom:14px}.pok-result{border:1px solid var(--line);border-radius:9px;padding:13px;margin-bottom:9px;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px}.pok-result h4{margin:0 0 5px;font-size:13px}.pok-result p{margin:3px 0;color:var(--muted);font-size:11px}.pok-result .amount{text-align:right;font-size:11px;color:var(--muted)}.pok-result .amount strong{display:block;color:var(--green);font-size:15px;margin-bottom:7px}.doc-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:linear-gradient(135deg,#0b477b,#0869b7);color:#fff;border-radius:14px;padding:24px;margin-bottom:16px}.doc-hero h3{font-size:20px;margin:0 0 8px}.doc-hero p{margin:0;color:#d6e8f6;font-size:13px}.doc-result{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.help-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}.help-item h3{font-size:14px;margin:0 0 8px}.help-item p,.help-item li{font-size:12px;line-height:1.65;color:var(--muted)}.loader{position:fixed;inset:0;background:rgba(244,248,251,.78);backdrop-filter:blur(2px);display:none;place-items:center;z-index:50}.loader.show{display:grid}.spinner{width:42px;height:42px;border:4px solid #d8e4ee;border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:24px;bottom:24px;background:#17364f;color:#fff;padding:13px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;z-index:60;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;max-width:440px}.toast.show{opacity:1;transform:none}.mobile-menu{display:none;border:0;background:transparent;font-size:22px}
    @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-even{grid-template-columns:1fr}.field.third{grid-column:span 6}.form-shell{grid-template-columns:1fr}.form-nav{display:none}.editor-quick-summary{grid-template-columns:repeat(2,1fr)}.tax-grid{grid-template-columns:1fr}.step-rail{overflow:auto;grid-template-columns:repeat(6,120px)}}
    @media(max-width:760px){.app{display:block}.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{grid-column:auto}.topbar{padding:0 16px;height:66px}.topbar h1{font-size:16px}.topbar p,.top-actions .btn,.user-pill{display:none}.mobile-menu{display:block}.content{padding:20px 14px 38px}.view-head{align-items:flex-start;flex-direction:column}.kpis,.fields,.help-grid{grid-template-columns:1fr}.field,.field.third,.field.quarter{grid-column:1}.doc-hero,.paste-box{grid-template-columns:1fr}.searchbox{min-width:0;width:100%}.editor-quick-summary{grid-template-columns:1fr 1fr}.app-footer{padding:16px}}
  </style>
  <style>.form-shell>div,.form-card{min-width:0}.table-wrap{max-width:100%}@media(max-width:760px){.editor-table{min-width:980px}.form-shell,.form-shell>div{width:100%;min-width:0}}</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><div><strong>Sistem Pengadaan</strong><small>Example Public Organization</small></div></div>
      <nav class="nav">
        <button class="active" data-view="dashboard"><span class="ico">D</span>Dashboard</button>
        <button data-view="packages"><span class="ico">P</span>Paket Pengadaan</button>
        <button data-view="editor"><span class="ico">+</span>Input/Edit Paket</button>
        <button data-view="budget"><span class="ico">POK</span>Pencarian POK</button>
        <button data-view="budgetUpdate" id="navBudgetUpdate"><span class="ico">UP</span>Update Anggaran</button>
        <button data-view="documents"><span class="ico">DOC</span>Dokumen & Arsip</button>
        <button data-view="admin" id="navAdmin"><span class="ico">ADM</span>Pengguna & Kalender</button>
        <button data-view="help"><span class="ico">?</span>Petunjuk</button>
      </nav>
      <div class="side-foot"><b id="revisionText">Memuat revisi POK…</b><br><span id="sideUser">Memeriksa akun…</span><div class="side-credit">Dibuat oleh Example Owner<br>owner@example.com</div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="mobileMenu">☰</button><div><h1 id="pageTitle">Dashboard Pengadaan</h1><p id="pageSubtitle">Ringkasan paket, anggaran, dan tindak lanjut</p></div></div><div class="top-actions"><span class="user-pill" id="userPill">Memuat akun…</span><select class="year-select" id="yearSelect"></select><button class="btn" id="refreshBtn">Segarkan</button><button class="btn" id="logoutBtn">Keluar</button></div></header>
      <div class="content">
        <section class="view active" id="view-dashboard"><div id="dashboardContent"></div></section>
        <section class="view" id="view-packages"><div id="packagesContent"></div></section>
        <section class="view" id="view-editor"><div id="editorContent"></div></section>
        <section class="view" id="view-budget"><div id="budgetContent"></div></section>
        <section class="view" id="view-budgetUpdate"><div id="budgetUpdateContent"></div></section>
        <section class="view" id="view-documents"><div id="documentsContent"></div></section>
        <section class="view" id="view-admin"><div id="adminContent"></div></section>
        <section class="view" id="view-help"><div id="helpContent"></div></section>
      </div>
      <footer class="app-footer">Dibuat oleh <b>Example Owner</b> · <a href="mailto:owner@example.com">owner@example.com</a></footer>
    </main>
  </div>
  <div class="loader" id="loader"><div><div class="spinner"></div><p style="color:#38536b;font-size:12px">Memproses…</p></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const state={year:new Date().getFullYear(),boot:null,current:null,pokResults:[],docPackageId:'',docResult:null,budgetUpload:null,budgetPreview:null};
    const titles={dashboard:['Dashboard Pengadaan','Ringkasan paket, anggaran, dan tindak lanjut'],packages:['Paket Pengadaan','Cari, buka, atau buat paket baru'],editor:['Input/Edit Paket','Simpan perubahan langsung ke database'],budget:['Pencarian POK','Cari rincian anggaran aktif'],budgetUpdate:['Update Anggaran','Unggah Excel, pilih sheet, preview, lalu aktifkan'],documents:['Dokumen & Arsip','Buat Google Docs dan PDF pada My Drive pengguna'],admin:['Pengguna & Kalender','Kelola akses dan tanggal nonkerja'],help:['Petunjuk Penggunaan','Alur kerja aman dari input sampai arsip']};
    const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const monthsLong=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const rp=n=>'Rp'+Math.round(Number(n||0)).toLocaleString('id-ID')+',-';
    const rpCompact=n=>{const v=Math.abs(Number(n||0));if(v>=1e9)return 'Rp'+(Number(n)/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' miliar';if(v>=1e6)return 'Rp'+(Number(n)/1e6).toLocaleString('id-ID',{maximumFractionDigits:2})+' juta';return rp(n)};
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const statusClass=s=>s==='Selesai'?'selesai':s==='Kontrak'?'kontrak':s==='FP Dibuat'?'fp':'draft';
    const isoDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v):'';
    function dateId(v){if(!isoDate(v))return 'Belum diisi';const [y,m,d]=v.split('-').map(Number);return d+' '+monthsLong[m-1]+' '+y}
    function googleFileUrl(s){try{const u=new URL(String(s||'').trim());return u.protocol==='https:'&&['docs.google.com','drive.google.com'].includes(u.hostname)?u.href:''}catch(_){return ''}}
    function fileLink(url,label,classes=''){const href=googleFileUrl(url);return href?`<a class="btn ${classes}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:`<button class="btn ${classes} disabled" disabled>${esc(label)} tidak tersedia</button>`}
    const showLoader=v=>document.getElementById('loader').classList.toggle('show',v);
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),4200)}
    function run(name,...args){return new Promise((resolve,reject)=>{if(!window.google||!google.script){reject(new Error('Pratinjau lokal tidak terhubung ke Apps Script.'));return}google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))))[name](...args)})}
    async function init(){showLoader(true);try{state.boot=await run('webBootstrap',state.year);state.year=state.boot.year;renderYear();applyPermissions();renderAll()}catch(e){renderAccessError(e.message)}finally{showLoader(false)}}
    function renderAccessError(message){const auth=String(message).startsWith('AUTH_REQUIRED|');document.getElementById('dashboardContent').innerHTML=auth?`<div class="view-head"><div><h2>Masuk ke Sistem Pengadaan</h2><p>Gunakan Gmail yang telah didaftarkan oleh Owner/Admin.</p></div></div><div class="panel" style="max-width:560px"><div class="fields"><div class="field full"><label>Email Gmail</label><input id="loginEmail" type="email" placeholder="user@example.com"></div><div class="field full"><button class="btn" onclick="requestOtp()">Kirim Kode 6 Digit</button></div><div class="field"><label>Kode dari email</label><input id="loginCode" inputmode="numeric" maxlength="6" placeholder="000000"></div><div class="field" style="align-self:end"><button class="btn primary" onclick="verifyOtp()">Masuk</button></div></div><div class="inline-note">Kode berlaku 10 menit. Pengguna tidak memperoleh akses ke spreadsheet atau kode Apps Script.</div></div>`:`<div class="view-head"><div><h2>Akses aplikasi belum siap</h2><p>Web app tidak dapat membaca database.</p></div></div><div class="warning"><b>${esc(message)}</b><br><br>Owner perlu menjalankan migrasi dan memastikan deployment memakai <b>Execute as: Me</b> serta <b>Who has access: Anyone with Google account</b>.</div>`;document.getElementById('revisionText').textContent=auth?'Belum masuk':'Akses belum siap'}
    async function requestOtp(){const email=document.getElementById('loginEmail').value;showLoader(true);try{const r=await run('webStartLogin',email);toast(r.message)}catch(e){toast(e.message)}finally{showLoader(false)}}
    async function verifyOtp(){const email=document.getElementById('loginEmail').value,code=document.getElementById('loginCode').value;showLoader(true);try{const r=await run('webVerifyLogin',email,code);toast(r.message);await init()}catch(e){toast(e.message)}finally{showLoader(false)}}
    async function logout(){showLoader(true);try{await run('webLogout');state.boot=null;state.current=null;await init()}catch(e){toast(e.message)}finally{showLoader(false)}}
    function applyPermissions(){const u=state.boot.user;document.getElementById('revisionText').textContent='POK aktif: '+state.boot.revision;document.getElementById('sideUser').textContent=u.name+' · '+u.role;document.getElementById('userPill').textContent=u.email+' · '+u.role;document.getElementById('navBudgetUpdate').style.display=u.canUpdateBudget?'flex':'none';document.getElementById('navAdmin').style.display=['Owner','Admin'].includes(u.role)?'flex':'none'}
    function renderYear(){document.getElementById('yearSelect').innerHTML=state.boot.years.map(v=>`<option ${v===state.year?'selected':''}>${v}</option>`).join('')}
    function renderAll(){renderDashboard();renderPackages();renderBudget();renderBudgetUpdate();renderDocuments();renderAdmin();renderHelp()}

    function renderDashboard(){const d=state.boot.dashboard,max=Math.max(...d.months,1);document.getElementById('dashboardContent').innerHTML=`<div class="view-head"><div><h2>Ringkasan ${state.year}</h2><p>Paket yang tampil mengikuti hak akses akun ${esc(state.boot.user.email)}.</p></div><div class="actions"><button class="btn primary" onclick="newPackage()">+ Paket Baru</button><button class="btn" onclick="nav('packages')">Cari Paket</button></div></div><div class="kpis"><div class="kpi"><div class="label">PAKET</div><div class="value">${d.totalPackages}</div><div class="hint">milik akun/seluruh paket untuk admin</div></div><div class="kpi"><div class="label">NILAI KONTRAK</div><div class="value">${rpCompact(d.totalContract)}</div><div class="hint">akumulasi ${state.year}</div></div><div class="kpi"><div class="label">SISA ANGGARAN POK</div><div class="value">${rpCompact(d.remainingBudget)}</div><div class="hint">dapat dilihat semua pengguna</div></div><div class="kpi"><div class="label">PERLU DITINDAKLANJUTI</div><div class="value">${d.issueCount}</div><div class="hint">alokasi/FP/validasi</div></div></div><div class="grid-2"><div class="panel"><div class="panel-head"><h3>Nilai kontrak per bulan</h3></div><div class="bars">${d.months.map((v,i)=>`<div class="month-bar" title="${months[i]}: ${rp(v)}"><i style="height:${Math.max(3,v/max*100)}%"></i><span>${months[i]}</span></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><h3>Komposisi status</h3></div><div class="status-row">${Object.entries(d.statuses).map(([k,v])=>`<div class="status-box"><strong>${v}</strong><span>${esc(k)}</span></div>`).join('')}</div>${d.issueCount?`<div class="warning" style="margin-top:14px">${d.issueCount} paket perlu diperiksa.</div>`:`<div class="success" style="margin-top:14px">Tidak ada peringatan.</div>`}</div></div><div class="grid-even"><div class="panel"><div class="panel-head"><h3>Vendor terpilih</h3></div><div class="share-list">${shareHtml(d.vendors)}</div></div><div class="panel"><div class="panel-head"><h3>Tim pengadaan</h3></div><div class="share-list">${shareHtml(d.teams)}</div></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Riwayat terbaru</h3><button class="btn small" onclick="nav('packages')">Lihat semua</button></div>${packageTable(d.recent)}</div>`}
    function shareHtml(rows){return rows.length?rows.map(r=>`<div class="share-row"><span>${esc(r.label)}</span><span class="share-track"><i style="width:${Math.round(r.share*100)}%"></i></span><b>${Math.round(r.share*100)}%</b></div>`).join(''):'<div class="empty">Belum ada data</div>'}
    function packageTable(rows){return rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>ID Paket</th><th>Nama Pengadaan</th><th>Penyedia</th><th>Tim</th><th>Nilai</th><th>Status</th><th>Pemilik</th><th>Aksi</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.id)}</b></td><td>${esc(p.name)}</td><td>${esc(p.vendor)}</td><td>${esc(p.team)}</td><td class="money">${rp(p.contract)}</td><td><span class="chip ${statusClass(p.status)}">${esc(p.status)}</span></td><td>${esc(p.ownerEmail||'-')}</td><td><button class="btn small" onclick="editPackage('${esc(p.id)}')">Buka</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada paket pada tahun ini.</div>'}
    function renderPackages(filter=''){const rows=state.boot.packages.filter(p=>!filter||[p.id,p.name,p.vendor,p.team,p.status,p.ownerEmail].join(' ').toLowerCase().includes(filter.toLowerCase()));document.getElementById('packagesContent').innerHTML=`<div class="view-head"><div><h2>Daftar Paket</h2><p>${state.boot.packages.length} paket pada ${state.year}</p></div><div class="actions"><div class="searchbox"><input id="packageSearch" placeholder="Cari paket…" value="${esc(filter)}"></div><button class="btn primary" onclick="newPackage()">+ Paket Baru</button></div></div><div class="panel">${packageTable(rows)}</div>`;document.getElementById('packageSearch').addEventListener('input',e=>renderPackages(e.target.value))}
    function emptyCosts(){return{shipping:0,administration:0,stampEnabled:true,stampAmount:10000,taxes:(state.boot.taxOptions||[]).map(t=>({...t,checked:Boolean(t.recommended)}))}}
    async function newPackage(){showLoader(true);try{const next=await run('webNextPackageId',state.year);state.current={package:{...next,name:'',team:'',teamLead:'',teamNip:'',vendor:'',status:'Draft',fp:0,contract:0,hps:0,offer:0,requestDate:'',poDate:'',bastDate:'',hpsDate:'',arrivalDate:'',mak:'',procurementOfficer:'',ppk:'',note:'',ownerEmail:state.boot.user.email},details:[],allocations:[],letters:letterTypes().map(type=>({type,date:'',number:'',pic:'',note:''})),costs:emptyCosts(),archives:[]};renderEditor();nav('editor')}catch(e){toast(e.message)}finally{showLoader(false)}}

    function normalizeCosts(){if(!state.current.costs)state.current.costs=emptyCosts();const existing=state.current.costs.taxes||[];state.current.costs.taxes=(state.boot.taxOptions||[]).map(t=>Object.assign({},t,existing.find(x=>x.key===t.key)||{checked:false}));state.current.costs.shipping=Number(state.current.costs.shipping||0);state.current.costs.administration=Number(state.current.costs.administration||0);state.current.costs.stampAmount=Number(state.current.costs.stampAmount||10000)}
    function letterTypes(){return ['Penetapan HPS','Permintaan Pengadaan','Surat Pesanan','Pemeriksaan Pekerjaan','BAST','Kuitansi','Invoice','Pemeriksaan Administrasi','Pembayaran']}
    function selectOptions(rows,key,value){return '<option value="">Pilih…</option>'+rows.map(r=>`<option value="${esc(r[key])}" ${String(r[key])===String(value)?'selected':''}>${esc(r[key])}</option>`).join('')}
    function renderEditor(){

      document.getElementById('editorContent').innerHTML=`
        <div class="view-head"><div><h2>Paket Pengadaan <span style="color:var(--blue);font-size:16px;margin-left:8px">${esc(p.id)}</span></h2><p>${p.name?esc(p.name):'Paket baru — lengkapi data berikut'}</p></div><div class="actions"><button class="btn" onclick="nav('packages')">Batal</button><button class="btn primary" onclick="savePackage()">Simpan Paket</button></div></div>
        <div class="step-rail"><div class="step active"><b>1</b>Identitas</div><div class="step done"><b>2</b>Anggaran POK</div><div class="step"><b>3</b>Barang/Jasa</div><div class="step"><b>4</b>Pajak & Biaya</div><div class="step"><b>5</b>Surat</div><div class="step"><b>6</b>Simpan</div></div>

        <div class="form-shell"><aside class="form-nav"><button onclick="scrollForm('identity')">1. Identitas</button><button onclick="scrollForm('details')">2. Barang/Jasa</button><button onclick="scrollForm('costs')">3. Pajak & Biaya</button><button onclick="scrollForm('allocation')">4. Anggaran POK</button><button onclick="scrollForm('letters')">5. Surat & Tanggal</button><button onclick="scrollForm('review')">6. Preview</button></aside><div>
        <section class="form-card" id="form-identity"><h3>Identitas Paket</h3><p class="desc">Pemilik paket: ${esc(p.ownerEmail||state.boot.user.email)}. User dapat mengedit paketnya pada seluruh status.</p><div class="fields">
          ${field('id','ID Paket',p.id,'text','quarter',true)}${field('year','Tahun',p.year,'number','quarter',true)}${field('seq','Nomor urut',p.seq,'number','quarter',true)}${field('name','Nama pengadaan',p.name,'text','full')}
          <div class="field third"><label>Subject Matter/Tim</label><select data-field="team" id="teamField">${selectOptions(state.boot.teams,'Tim',p.team)}</select></div>${field('teamLead','Ketua Tim',p.teamLead,'text','third',true)}${field('teamNip','NIP Ketua Tim',p.teamNip,'text','third',true)}
          <div class="field third"><label>Penyedia</label><select data-field="vendor">${selectOptions(state.boot.vendors,'Nama Usaha',p.vendor)}</select></div><div class="field third"><label>Status</label><select data-field="status">${['Draft','FP Dibuat','Kontrak','Selesai'].map(v=>`<option ${v===p.status?'selected':''}>${v}</option>`).join('')}</select></div>
          <div class="field third"><label>MAK Utama</label><select data-field="mak" ${makRows.length?'':'disabled'}><option value="">${makRows.length?'Pilih MAK dari alokasi…':'Tambahkan POK terlebih dahulu'}</option>${makRows.map(a=>`<option value="${esc(a.mak)}" ${a.mak===p.mak?'selected':''}>${esc(a.mak)} — ${esc(a.description)}</option>`).join('')}</select></div>
          <div class="field third"><label>Pejabat Pengadaan</label><select data-field="procurementOfficer">${selectOptions(proc.length?proc:off,'Nama',p.procurementOfficer)}</select></div><div class="field third"><label>PPK</label><select data-field="ppk">${selectOptions(ppks.length?ppks:off,'Nama',p.ppk)}</select></div>${field('note','Catatan',p.note,'textarea','third')}
        </div></section>
        <section class="form-card" id="form-details"><h3>Rincian Barang/Jasa</h3><p class="desc">Tab ke kanan, Shift+Tab ke kiri, Enter ke baris berikutnya. Paste tabel Excel langsung pada sel atau kotak di bawah.</p>
          <div class="paste-box"><textarea id="detailPaste" placeholder="Uraian [Tab] Spesifikasi [Tab] Volume [Tab] Satuan [Tab] Harga Bersih [Tab] HPS [Tab] Penawaran [Tab] Kontrak"></textarea><button class="btn" onclick="pasteDetailBox()">Tempel Tabel Excel</button></div>
          <div class="table-wrap"><table class="editor-table"><thead><tr><th>No</th><th>Uraian</th><th>Spesifikasi</th><th>Vol.</th><th>Satuan</th><th>Harga Bersih</th><th>HPS</th><th>Penawaran</th><th>Kontrak</th><th></th></tr></thead><tbody>${detailsHtml()}</tbody></table></div>
          <div class="subactions"><button class="btn small" onclick="addDetail()">+ Tambah Item</button><div class="summary-line"><span>Total Bersih<strong id="detailNetTotal">${rp(detailNetTotal())}</strong></span><span>Total Kontrak Item<strong id="detailContractTotal">${rp(detailContractTotal())}</strong></span></div></div>
        </section>
        <section class="form-card" id="form-costs"><h3>Pajak dan Biaya Paket</h3><p class="desc">Harga bersih adalah target dasar penyedia. Tarif hanya rekomendasi; centang sesuai hasil verifikasi bendahara.</p>
          <div class="grid-even"><div><div class="tax-grid">${taxOptionsHtml()}</div><div class="fields" style="margin-top:13px">${costMoneyField('shipping','Ongkir/transportasi',state.current.costs.shipping)}${costMoneyField('administration','Administrasi lain',state.current.costs.administration)}<div class="field"><label>Meterai ditanggung penyedia</label><div class="tax-option"><input type="checkbox" data-cost-check="stampEnabled" ${state.current.costs.stampEnabled?'checked':''}><span>Otomatis bila kontrak &gt; Rp5 juta</span><input type="number" min="0" data-cost="stampAmount" value="${state.current.costs.stampAmount}"></div></div></div></div><div class="calc-box" id="costResult">${costResultHtml()}</div></div>
        </section>
        <section class="form-card" id="form-allocation"><h3>Alokasi Anggaran POK</h3><p class="desc">MAK Utama dipilih dari daftar POK yang dialokasikan.</p>${allocationHtml()}<div class="subactions"><button class="btn small" onclick="openBudgetForPackage()">Cari & Tambah Rincian POK</button><b>Total kontrak dialokasikan: ${rp(state.current.allocations.reduce((a,x)=>a+Number(x.contract||0),0))}</b></div></section>
        <section class="form-card" id="form-letters"><h3>Jadwal dan Nomor Surat</h3><p class="desc">Selisih dihitung sebagai hari kalender, lalu digeser ke hari kerja berikutnya bila jatuh pada Sabtu, Minggu, libur nasional, cuti bersama, atau tanggal khusus aktif.</p>
          <div class="fields">${dateField('hpsDate','Tanggal Penetapan HPS',p.hpsDate,'third')}${dateField('arrivalDate','Tanggal Barang Sampai',p.arrivalDate,'third')}<div class="field third" style="align-self:end"><button class="btn primary" style="width:100%" onclick="generateSchedule()">Hitung Jadwal & Nomor</button></div></div>
          <div class="table-wrap" style="margin-top:15px"><table class="editor-table"><thead><tr><th>Jenis dokumen</th><th>Tanggal</th><th>Format Indonesia</th><th>Nomor surat</th><th>PIC</th></tr></thead><tbody>${lettersHtml()}</tbody></table></div>
        </section>
        <section class="form-card" id="form-review"><h3>Nilai Utama dan Simpan</h3><p class="desc">Nilai kontrak dapat diisi dari kalkulator lalu tetap dapat diedit.</p><div class="fields">${moneyField('hps','Nilai HPS',p.hps)}${moneyField('offer','Nilai penawaran',p.offer)}${moneyField('contract','Nilai kontrak/nego',p.contract)}${moneyField('fp','Nilai FP',p.fp)}</div><div class="warning" style="margin-top:15px">Kontrak tidak boleh melebihi HPS. Untuk status selain Draft, FP tidak boleh lebih kecil daripada kontrak.</div><button class="btn primary" style="margin-top:16px" onclick="savePackage()">Simpan ${esc(p.id)}</button></section>
        </div></div>`;
      bindEditor();

    function field(k,label,v,type='text',cls='',ro=false){return `<div class="field ${cls}"><label>${label}</label>${type==='textarea'?`<textarea data-field="${k}" ${ro?'readonly':''}>${esc(v)}</textarea>`:`<input data-field="${k}" type="${type}" value="${esc(v)}" ${ro?'readonly':''}>`}</div>`}
    function moneyField(k,label,v){return `<div class="field quarter"><label>${label}</label><input class="currency" data-field="${k}" data-number="${Number(v||0)}" value="${rp(v)}"><div class="inline-note">${rp(v)}</div></div>`}
    function costMoneyField(k,label,v){return `<div class="field"><label>${label}</label><input type="number" min="0" data-cost="${k}" value="${Number(v||0)}"><div class="inline-note">${rp(v)}</div></div>`}
    function dateField(k,label,v,cls=''){return `<div class="field ${cls}"><label>${label}</label><input type="date" data-field="${k}" value="${esc(isoDate(v))}"><div class="date-id" data-date-label="${k}">${dateId(v)}</div></div>`}
    function detailsHtml(){return state.current.details.length?state.current.details.map((d,i)=>`<tr><td><input class="w-xs" data-detail="${i}:no" value="${esc(d.no||i+1)}"></td><td><input class="w-md" data-detail="${i}:description" value="${esc(d.description)}"></td><td><input class="w-md" data-detail="${i}:specification" value="${esc(d.specification)}"></td><td><input class="w-xs" data-detail="${i}:quantity" value="${esc(d.quantity)}"></td><td><input class="w-xs" data-detail="${i}:unit" value="${esc(d.unit)}"></td><td><input class="w-sm" data-detail="${i}:netUnit" value="${esc(d.netUnit)}"></td><td><input class="w-sm" data-detail="${i}:hpsUnit" value="${esc(d.hpsUnit)}"></td><td><input class="w-sm" data-detail="${i}:offerUnit" value="${esc(d.offerUnit)}"></td><td><input class="w-sm" data-detail="${i}:contractUnit" value="${esc(d.contractUnit)}"></td><td><button class="btn small danger" onclick="removeDetail(${i})">×</button></td></tr>`).join(''):'<tr><td colspan="10"><div class="empty">Belum ada item.</div></td></tr>'}
    function allocationHtml(){return state.current.allocations.length?`<div class="table-wrap"><table class="editor-table"><thead><tr><th>Kode POK</th><th>MAK Lengkap</th><th>Rincian</th><th>Nilai FP</th><th>Kontrak</th><th></th></tr></thead><tbody>${state.current.allocations.map((a,i)=>`<tr><td>${esc(a.code)}</td><td>${esc(a.mak||'')}</td><td>${esc(a.description)}</td><td><input data-allocation="${i}:fp" value="${esc(a.fp)}"></td><td><input data-allocation="${i}:contract" value="${esc(a.contract)}"></td><td><button class="btn small danger" onclick="removeAllocation(${i})">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada alokasi anggaran.</div>'}
    function lettersHtml(){return state.current.letters.map((l,i)=>`<tr><td><b>${esc(l.type)}</b></td><td><input type="date" data-letter="${i}:date" value="${esc(isoDate(l.date))}"></td><td><span class="date-id" data-letter-label="${i}">${dateId(l.date)}</span></td><td><input data-letter="${i}:number" value="${esc(l.number)}" placeholder="${l.type==='Invoice'?'Isi nomor invoice penyedia':'Otomatis; tetap dapat diedit'}"></td><td><input data-letter="${i}:pic" value="${esc(l.pic)}"></td></tr>`).join('')}
    function taxOptionsHtml(){return state.current.costs.taxes.map((t,i)=>`<label class="tax-option"><input type="checkbox" data-tax-check="${i}" ${t.checked?'checked':''}><span>${esc(t.label)}</span><input type="number" step=".1" min="0" max="100" data-tax-rate="${i}" value="${Number(t.rate||0)}"></label>`).join('')}
    function detailNetTotal(){return state.current.details.reduce((a,d)=>a+Number(d.quantity||0)*Number(d.netUnit||0),0)}
    function detailContractTotal(){return state.current.details.reduce((a,d)=>a+Number(d.quantity||0)*Number(d.contractUnit||0),0)}
    function calcCosts(){const c=state.current.costs,net=detailNetTotal(),extras=Number(c.shipping||0)+Number(c.administration||0),base=net+extras;const withholdingRate=c.taxes.filter(t=>t.checked&&t.kind!=='addition').reduce((a,t)=>a+Number(t.rate||0),0);const additionRate=c.taxes.filter(t=>t.checked&&t.kind==='addition').reduce((a,t)=>a+Number(t.rate||0),0);const dpp=withholdingRate>=100?0:base/(1-withholdingRate/100);const withholding=Math.round(dpp*withholdingRate/100);const addition=Math.round(dpp*additionRate/100);const contract=Math.round(dpp+addition);const stamp=c.stampEnabled&&contract>5000000?Number(c.stampAmount||10000):0;return{net,extras,base,withholdingRate,additionRate,withholding,addition,contract,stamp,transfer:contract-withholding-stamp}}
    function costResultHtml(){const x=calcCosts();return `<div class="calc-row"><span>Total harga bersih item</span><b>${rp(x.net)}</b></div><div class="calc-row"><span>Ongkir + administrasi</span><b>${rp(x.extras)}</b></div><div class="calc-row"><span>Pajak potong (${x.withholdingRate.toLocaleString('id-ID')}%)</span><b>${rp(x.withholding)}</b></div><div class="calc-row"><span>Pajak tambahan/PPN (${x.additionRate.toLocaleString('id-ID')}%)</span><b>${rp(x.addition)}</b></div><div class="calc-row"><span>Meterai ditanggung penyedia</span><b>${rp(x.stamp)}</b></div><div class="calc-row total"><span>Nilai kontrak hasil hitung</span><span>${rp(x.contract)}</span></div><div class="calc-row"><span>Perkiraan transfer setelah potongan</span><b>${rp(x.transfer)}</b></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="applyCalculatedContract()">Gunakan sebagai Nilai Kontrak</button><div class="inline-note">Rumus dan pilihan tarif harus diverifikasi bendahara sebelum kontrak dibuat.</div>`}
    function updateLive(){if(!state.current)return;['hps','offer','contract','fp'].forEach(k=>{const el=document.querySelector('[data-summary="'+k+'"]');if(el)el.textContent=rp(state.current.package[k])});const n=document.getElementById('detailNetTotal');if(n)n.textContent=rp(detailNetTotal());const c=document.getElementById('detailContractTotal');if(c)c.textContent=rp(detailContractTotal());const box=document.getElementById('costResult');if(box)box.innerHTML=costResultHtml()}
    function bindEditor(){
      document.querySelectorAll('[data-field]').forEach(el=>{el.addEventListener('input',()=>{let v=el.value;if(el.classList.contains('currency')){v=Number(v.replace(/\D/g,''));el.dataset.number=v}state.current.package[el.dataset.field]=v;const label=document.querySelector('[data-date-label="'+el.dataset.field+'"]');if(label)label.textContent=dateId(v);updateLive()});if(el.classList.contains('currency')){el.addEventListener('focus',()=>el.value=el.dataset.number||0);el.addEventListener('blur',()=>{el.value=rp(el.dataset.number);if(el.nextElementSibling)el.nextElementSibling.textContent=el.value;updateLive()})}});
      document.querySelectorAll('[data-detail]').forEach(el=>{el.addEventListener('input',()=>updateDetailFromInput(el));el.addEventListener('keydown',detailKeydown);el.addEventListener('paste',detailPaste)});
      document.querySelectorAll('[data-allocation]').forEach(el=>el.addEventListener('input',()=>{const[i,k]=el.dataset.allocation.split(':');state.current.allocations[i][k]=Number(el.value.replace(/\D/g,''));updateLive()}));
      document.querySelectorAll('[data-letter]').forEach(el=>el.addEventListener('input',()=>{const[i,k]=el.dataset.letter.split(':');state.current.letters[i][k]=el.value;const label=document.querySelector('[data-letter-label="'+i+'"]');if(k==='date'&&label)label.textContent=dateId(el.value)}));
      document.querySelectorAll('[data-cost]').forEach(el=>el.addEventListener('input',()=>{state.current.costs[el.dataset.cost]=Number(el.value||0);if(el.nextElementSibling)el.nextElementSibling.textContent=rp(el.value);updateLive()}));
      document.querySelectorAll('[data-cost-check]').forEach(el=>el.addEventListener('change',()=>{state.current.costs[el.dataset.costCheck]=el.checked;updateLive()}));
      document.querySelectorAll('[data-tax-check]').forEach(el=>el.addEventListener('change',()=>{state.current.costs.taxes[Number(el.dataset.taxCheck)].checked=el.checked;updateLive()}));
      document.querySelectorAll('[data-tax-rate]').forEach(el=>el.addEventListener('input',()=>{state.current.costs.taxes[Number(el.dataset.taxRate)].rate=Number(el.value||0);updateLive()}));
      const team=document.getElementById('teamField');if(team)team.addEventListener('change',e=>{const t=state.boot.teams.find(x=>x.Tim===e.target.value)||{};state.current.package.team=e.target.value;state.current.package.teamLead=t['Ketua Tim']||'';state.current.package.teamNip=t.NIP||'';renderEditor()});
    }
    function updateDetailFromInput(el){const[i,k]=el.dataset.detail.split(':');state.current.details[i][k]=['no','quantity','netUnit','hpsUnit','offerUnit','contractUnit'].includes(k)?Number(el.value.replace(/[^0-9.-]/g,'')):el.value;updateLive()}
    function detailKeydown(e){const[i,k]=e.target.dataset.detail.split(':');const keys=['no','description','specification','quantity','unit','netUnit','hpsUnit','offerUnit','contractUnit'];const row=Number(i),col=keys.indexOf(k);if(e.key==='Enter'){e.preventDefault();if(row===state.current.details.length-1)addDetail(false);setTimeout(()=>focusDetail(Math.min(row+1,state.current.details.length-1),col),0)}else if(e.key==='Tab'&&!e.shiftKey&&row===state.current.details.length-1&&k==='contractUnit'){e.preventDefault();addDetail(false);setTimeout(()=>focusDetail(state.current.details.length-1,1),0)}}
    function focusDetail(row,col){const keys=['no','description','specification','quantity','unit','netUnit','hpsUnit','offerUnit','contractUnit'];const el=document.querySelector('[data-detail="'+row+':'+keys[col]+'"]');if(el){el.focus();el.select()}}
    function detailPaste(e){const text=e.clipboardData&&e.clipboardData.getData('text/plain');if(!text||(!text.includes('\t')&&!text.includes('\n')))return;e.preventDefault();const[i,k]=e.target.dataset.detail.split(':');pasteMatrix(text,Number(i),['description','specification','quantity','unit','netUnit','hpsUnit','offerUnit','contractUnit'].indexOf(k))}
    function pasteDetailBox(){const text=document.getElementById('detailPaste').value;if(!text.trim()){toast('Salin tabel Excel lalu tempel pada kotak.');return}pasteMatrix(text,0,0)}
    function pasteMatrix(text,startRow,startCol){let rows=String(text).trim().split(/\r?\n/).map(r=>r.split('\t'));if(rows[0]&&/uraian|deskripsi/i.test(rows[0][0]))rows.shift();const keys=['description','specification','quantity','unit','netUnit','hpsUnit','offerUnit','contractUnit'];while(state.current.details.length<startRow+rows.length)state.current.details.push(blankDetail());rows.forEach((cells,ri)=>cells.forEach((v,ci)=>{const key=keys[startCol+ci];if(!key)return;state.current.details[startRow+ri][key]=['quantity','netUnit','hpsUnit','offerUnit','contractUnit'].includes(key)?Number(String(v).replace(/[^0-9.-]/g,'')):String(v).trim()}));state.current.details.forEach((d,i)=>d.no=i+1);renderEditor();setTimeout(()=>scrollForm('details'),0);toast(rows.length+' baris berhasil ditempel dari Excel.')}
    function blankDetail(){return{no:state.current.details.length+1,description:'',specification:'',quantity:1,unit:'buah',netUnit:0,hpsUnit:0,offerUnit:0,contractUnit:0,pokId:''}}
    function addDetail(scroll=true){state.current.details.push(blankDetail());renderEditor();if(scroll)setTimeout(()=>scrollForm('details'),0)}
    function removeDetail(i){state.current.details.splice(i,1);state.current.details.forEach((d,j)=>d.no=j+1);renderEditor()}
    function removeAllocation(i){state.current.allocations.splice(i,1);if(!state.current.allocations.some(a=>a.mak===state.current.package.mak))state.current.package.mak=state.current.allocations[0]?.mak||'';renderEditor()}
    function applyCalculatedContract(){const x=calcCosts();if(!(x.contract>0)){toast('Isi harga bersih item terlebih dahulu.');return}state.current.package.contract=x.contract;const net=detailNetTotal(),target=Math.max(0,x.contract-x.extras);if(net>0)state.current.details.forEach(d=>d.contractUnit=Math.round(Number(d.netUnit||0)*target/net));renderEditor();setTimeout(()=>scrollForm('review'),0);toast('Nilai kontrak diisi dari kalkulator. Periksa pembulatan pada rincian.')}
    async function generateSchedule(){const p=state.current.package;if(!p.hpsDate||!p.arrivalDate){toast('Isi tanggal Penetapan HPS dan Barang Sampai.');return}showLoader(true);try{const result=await run('webGenerateLetterSchedule',p.id,p.hpsDate,p.arrivalDate);state.current.letters=result.letters;p.requestDate=result.requestDate;p.poDate=result.poDate;p.bastDate=result.bastDate;p.hpsDate=result.hpsDate;p.arrivalDate=result.arrivalDate;renderEditor();setTimeout(()=>scrollForm('letters'),0);toast('Jadwal dan nomor surat dihitung sesuai kalender kerja.')}catch(e){toast(e.message)}finally{showLoader(false)}}
    function scrollForm(id){document.getElementById('form-'+id)?.scrollIntoView({behavior:'smooth',block:'start'})}
    async function savePackage(){showLoader(true);try{const result=await run('webSavePackage',state.current);toast(result.message);state.current=await run('webGetPackage',result.id);state.boot=await run('webBootstrap',state.year);renderYear();applyPermissions();renderAll();renderEditor()}catch(e){toast(e.message)}finally{showLoader(false)}}
    function openBudgetForPackage(){nav('budget');document.getElementById('pokQuery')?.focus();toast('Cari rincian lalu klik Tambahkan ke Paket.')}
    function renderBudget(){document.getElementById('budgetContent').innerHTML=`<div class="view-head"><div><h2>Pencarian POK Aktif</h2><p>Semua pengguna dapat melihat sisa anggaran.</p></div></div><div class="panel"><div class="pok-search"><input id="pokQuery" placeholder="Cari kode, kegiatan, akun, atau uraian…"><button class="btn primary" onclick="searchPok()">Cari</button></div><div id="pokResults"><div class="empty">Hasil pencarian akan muncul di sini.</div></div></div>`;document.getElementById('pokQuery').addEventListener('keydown',e=>{if(e.key==='Enter')searchPok()})}
    async function searchPok(){const q=document.getElementById('pokQuery').value;if(q.trim().length<2){toast('Ketik minimal 2 karakter.');return}showLoader(true);try{state.pokResults=await run('webSearchPok',q,30);document.getElementById('pokResults').innerHTML=state.pokResults.length?state.pokResults.map((r,i)=>`<div class="pok-result"><div><h4>${esc(r.description)}</h4><p>${esc(r.code)} · ${esc(r.mak)}</p><p>Volume ${esc(r.volume)} ${esc(r.unit)} · Harga satuan ${rp(r.unitPrice)}</p></div><div class="amount">Sisa anggaran<strong>${rp(r.remaining)}</strong>${state.current?`<button class="btn small primary" onclick="addPok(${i})">Tambahkan ke Paket</button>`:''}</div></div>`).join(''):'<div class="empty">Tidak ada rincian yang cocok.</div>'}catch(e){toast(e.message)}finally{showLoader(false)}}
    function addPok(i){if(!state.current){toast('Buka atau buat paket terlebih dahulu.');return}const r=state.pokResults[i];if(state.current.allocations.some(x=>x.pokId===r.id)){toast('Rincian ini sudah dialokasikan.');return}state.current.allocations.push({pokId:r.id,code:r.code,mak:r.mak,description:r.description,fp:0,contract:0,note:''});if(!state.current.package.mak)state.current.package.mak=r.mak;renderEditor();nav('editor');setTimeout(()=>scrollForm('allocation'),0)}
    function renderBudgetUpdate(){const el=document.getElementById('budgetUpdateContent');if(!state.boot||!state.boot.user.canUpdateBudget){el.innerHTML='<div class="warning">Akun ini tidak memiliki izin Update Anggaran.</div>';return}el.innerHTML=`<div class="view-head"><div><h2>Update Anggaran dari Excel</h2><p>File asli disimpan sebagai arsip. Database baru aktif hanya setelah preview dan konfirmasi.</p></div></div><div class="panel"><div class="fields"><div class="field"><label>File Excel</label><input id="budgetFile" type="file" accept=".xlsx,.xls"></div><div class="field" style="align-self:end"><button class="btn primary" onclick="uploadBudget()">Unggah dan Baca Sheet</button></div></div><div id="budgetUploadResult" style="margin-top:15px"></div></div>`}
    async function uploadBudget(){const file=document.getElementById('budgetFile').files[0];if(!file){toast('Pilih file Excel.');return}showLoader(true);try{const base64=await fileBase64(file);state.budgetUpload=await run('webUploadBudgetExcel',{name:file.name,base64});document.getElementById('budgetUploadResult').innerHTML=`<div class="success">File asli sudah diarsipkan.</div><div class="fields" style="margin-top:13px"><div class="field"><label>Pilih sheet POK</label><select id="budgetSheet">${state.budgetUpload.sheets.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div><div class="field" style="align-self:end"><button class="btn" onclick="previewBudget()">Preview Perubahan</button></div></div><div id="budgetPreview"></div>`}catch(e){toast(e.message)}finally{showLoader(false)}}
    function fileBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}
    async function previewBudget(){showLoader(true);try{const sheet=document.getElementById('budgetSheet').value;state.budgetPreview=await run('webPreviewBudgetImport',state.budgetUpload.token,sheet,state.budgetUpload.archiveUrl,state.budgetUpload.name);const p=state.budgetPreview;document.getElementById('budgetPreview').innerHTML=`<div class="calc-box" style="margin-top:14px"><div class="calc-row"><span>Revisi</span><b>${esc(p.revision)}</b></div><div class="calc-row"><span>Jumlah rincian</span><b>${p.rows}</b></div><div class="calc-row"><span>Total pagu</span><b>${rp(p.total)}</b></div><div class="calc-row"><span>Baru / berubah / hilang</span><b>${p.added} / ${p.changed} / ${p.removed}</b></div><button class="btn orange" style="margin-top:12px" onclick="applyBudget()">Aktifkan Revisi Ini</button></div>`}catch(e){toast(e.message)}finally{showLoader(false)}}
    async function applyBudget(){if(!state.budgetPreview||!confirm('Aktifkan revisi ini? Revisi lama akan dipindahkan ke arsip.'))return;showLoader(true);try{const r=await run('webApplyBudgetImport',state.budgetPreview);toast(r.message);state.boot=await run('webBootstrap',state.year);applyPermissions();renderAll()}catch(e){toast(e.message)}finally{showLoader(false)}}
    function renderDocuments(){const packs=state.boot.packages;document.getElementById('documentsContent').innerHTML=`<div class="view-head"><div><h2>Dokumen dan Arsip</h2><p>Google Docs dan PDF disimpan pada Shared Drive/folder kantor.</p></div></div><div class="doc-hero"><div><h3>Buat Google Docs & PDF</h3><p>File dibuat oleh sistem dan dibagikan kepada Gmail pembuat paket.</p><div style="margin-top:16px"><select id="docPackage" class="year-select" style="min-width:300px"><option value="">Pilih paket…</option>${packs.map(p=>`<option value="${esc(p.id)}" ${state.docPackageId===p.id?'selected':''}>${esc(p.id)} — ${esc(p.name)}</option>`).join('')}</select></div><div id="docResult" class="doc-result">${docResultHtml()}</div></div><button class="btn orange" onclick="createDocs()">Buat Dokumen</button></div><div class="panel"><div class="panel-head"><h3>Arsip paket terpilih</h3></div><div id="archiveList"><div class="empty">Pilih paket untuk melihat arsip.</div></div></div>`;document.getElementById('docPackage').addEventListener('change',e=>{state.docPackageId=e.target.value;loadArchives()});if(state.docPackageId)loadArchives()}
    function docResultHtml(){return state.docResult?fileLink(state.docResult.docsUrl,'Buka Google Docs')+fileLink(state.docResult.pdfUrl,'Buka/Cetak PDF','primary'):''}
    async function loadArchives(){if(!state.docPackageId){document.getElementById('archiveList').innerHTML='<div class="empty">Pilih paket.</div>';return}try{const rows=await run('webGetArchives',state.docPackageId);document.getElementById('archiveList').innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Versi</th><th>Dibuat</th><th>Pembuat</th><th>Dokumen</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>v${r.version}</b></td><td>${esc(r.createdAt)}</td><td>${esc(r.author)}</td><td>${fileLink(r.docsUrl,'Docs','small')} ${fileLink(r.pdfUrl,'PDF','small primary')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada dokumen.</div>'}catch(e){toast(e.message)}}
    async function createDocs(){state.docPackageId=document.getElementById('docPackage').value;if(!state.docPackageId){toast('Pilih paket.');return}showLoader(true);try{state.docResult=await run('webCreateDocuments',state.docPackageId);toast('Dokumen versi '+state.docResult.version+' dibuat di Shared Drive kantor.');renderDocuments()}catch(e){toast(e.message)}finally{showLoader(false)}}
    function renderAdmin(){const el=document.getElementById('adminContent');if(!state.boot||!['Owner','Admin'].includes(state.boot.user.role)){el.innerHTML='<div class="warning">Menu ini hanya untuk Owner/Admin.</div>';return}const users=state.boot.users||[],cal=state.boot.calendar||[];el.innerHTML=`<div class="view-head"><div><h2>Pengguna dan Kalender Kerja</h2><p>Admin dapat mengelola User; hanya Owner yang dapat menetapkan Admin.</p></div></div><div class="grid-even"><div class="panel"><div class="panel-head"><h3>Tambah/Perbarui Pengguna</h3></div><div class="fields"><div class="field full"><label>Email Gmail</label><input id="userEmail" type="email"></div><div class="field full"><label>Nama</label><input id="userName"></div><div class="field"><label>Peran</label><select id="userRole"><option>User</option>${state.boot.user.role==='Owner'?'<option>Admin</option>':''}</select></div><div class="field"><label><input id="userBudget" type="checkbox"> Boleh Update Anggaran</label></div></div><button class="btn primary" onclick="saveUser()">Simpan Pengguna</button></div><div class="panel"><div class="panel-head"><h3>Tambah Tanggal Nonkerja</h3></div><div class="fields"><div class="field"><label>Tanggal</label><input id="calDate" type="date"></div><div class="field"><label>Jenis</label><select id="calType"><option>Khusus</option><option>Hari Kejepit</option><option>Cuti Bersama</option><option>Libur Nasional</option></select></div><div class="field full"><label>Keterangan</label><input id="calLabel"></div></div><button class="btn" onclick="saveCalendar()">Simpan Tanggal</button></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Daftar Pengguna</h3></div>${usersTable(users)}</div><div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Kalender 2026 dan Usulan Hari Kejepit</h3></div>${calendarTable(cal)}</div>`}
    function usersTable(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>Email</th><th>Nama</th><th>Peran</th><th>Aktif</th><th>Update Anggaran</th><th>Aksi</th></tr></thead><tbody>${rows.map((u,i)=>`<tr><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${u.active?'Ya':'Tidak'}</td><td>${u.canUpdateBudget?'Ya':'Tidak'}</td><td>${u.role==='Owner'?'—':`<button class="btn small" onclick="editUser(${i})">Edit</button>`}</td></tr>`).join('')}</tbody></table></div>`}
    function editUser(i){const u=state.boot.users[i];document.getElementById('userEmail').value=u.email;document.getElementById('userName').value=u.name;document.getElementById('userRole').value=u.role;document.getElementById('userBudget').checked=u.canUpdateBudget}
    async function saveUser(){const payload={email:document.getElementById('userEmail').value,name:document.getElementById('userName').value,role:document.getElementById('userRole').value,active:true,canUpdateBudget:document.getElementById('userBudget').checked};showLoader(true);try{const r=await run('webSaveUser',payload);state.boot.users=r.users;toast(r.message);renderAdmin()}catch(e){toast(e.message)}finally{showLoader(false)}}
    function calendarTable(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Jenis</th><th>Aktif</th><th>Aksi</th></tr></thead><tbody>${rows.filter(r=>r.date.startsWith('2026')).map((r,i)=>`<tr><td>${dateId(r.date)}</td><td>${esc(r.label)}</td><td>${esc(r.type)}</td><td>${r.active?'Ya':'Tidak'}</td><td><button class="btn small" onclick="toggleCalendar('${r.date}',${r.active?'false':'true'},'${esc(r.label).replace(/'/g,'&#39;')}','${esc(r.type)}')">${r.active?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')}</tbody></table></div>`}
    async function saveCalendar(){const payload={date:document.getElementById('calDate').value,label:document.getElementById('calLabel').value,type:document.getElementById('calType').value,active:true};await sendCalendar(payload)}
    async function toggleCalendar(date,active,label,type){await sendCalendar({date,label,type,active})}
    async function sendCalendar(payload){showLoader(true);try{const r=await run('webSaveCalendar',payload);state.boot.calendar=r.calendar;toast(r.message);renderAdmin()}catch(e){toast(e.message)}finally{showLoader(false)}}
    function renderHelp(){document.getElementById('helpContent').innerHTML=`<div class="view-head"><div><h2>Alur Penggunaan</h2><p>Aplikasi bekerja dengan Gmail yang terdaftar dan kode masuk sekali pakai.</p></div></div><div class="help-grid"><div class="help-item"><h3>Akses pengguna lain</h3><p>Deployment memakai <b>Execute as: Me</b> dan <b>Who has access: Anyone with Google account</b>. Pengguna membuka link /exec langsung, meminta kode ke Gmail, lalu masuk. Tidak perlu membuka Drive lebih dahulu.</p></div><div class="help-item"><h3>Keamanan kode dan database</h3><p>Pengguna tidak dibagikan spreadsheet dan proyek Apps Script. Semua perubahan melewati web app serta audit pengguna.</p></div><div class="help-item"><h3>Dokumen kantor</h3><p>Docs dan PDF disimpan di Shared Drive/folder kantor, lalu dibagikan kepada Gmail pembuat. File menjadi milik organisasi, bukan Drive pribadi Owner.</p></div><div class="help-item"><h3>Rincian dari Excel</h3><p>Urutan kolom: Uraian, Spesifikasi, Volume, Satuan, Harga Bersih, HPS, Penawaran, Kontrak. Header boleh ikut dan akan dilewati.</p></div><div class="help-item"><h3>Jadwal surat</h3><p>Isi tanggal HPS dan barang sampai, lalu hitung. Semua hasil dapat diedit manual. Format nomor: B.DD-MM.urutan/UNIT/CLASS/MM/YYYY.</p></div><div class="help-item"><h3>Pajak dan update anggaran</h3><p>Tarif wajib diverifikasi bendahara. Pengguna berizin dapat unggah Excel, memilih sheet, preview, dan mengaktifkan revisi; file asli tetap diarsipkan.</p></div></div>`}
    document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));
    document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
    document.getElementById('refreshBtn').addEventListener('click',init);
    document.getElementById('logoutBtn').addEventListener('click',logout);
    document.getElementById('yearSelect').addEventListener('change',async e=>{state.year=Number(e.target.value);await init()});
    init();
  </script>
</body>
</html>
